<!DOCTYPE html>
<html>
<head>
    <title>House Rent Prediction</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4fac4f, #00f2fe);

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
            margin:0;
        }

        .container{
            background:skyblue;
            width:520px;
            max-height:90vh;

            padding:25px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);

            overflow-y:auto;
        }

        h2{
            text-align:center;
            margin-bottom:15px;
        }

        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .full{
            grid-column: span 2;
        }

        label{
            font-size:14px;
            margin-bottom:5px;
            display:block;
        }

        input, select{
            width:100%;
            padding:10px;

            border-radius:8px;
            border:1px solid #ccc;

            box-sizing:border-box;
            font-size:14px;
        }

        input:focus, select:focus{
            outline:none;
            border-color:#4fac4f;
            box-shadow:0 0 5px rgba(79,172,79,0.4);
        }

        button{
            width:100%;
            padding:12px;

            background:#4fac4f;
            color:white;

            border:none;
            border-radius:8px;

            cursor:pointer;
            font-size:16px;

            transition:0.3s;
            position:relative;
            overflow: hidden;
        }

        button:hover{
            background:#00c6fb;
            transform:scale(1.03)
        }
        /* click animation */
        button:active{
            transform: scale(0.97);
        }
        /* loading spinner */
        .spinner{
            display: none;
            width: 18px;
            height: 18px;

            border:3px solid #fff;
            border-top: 3px solid transparent;

            border-radius: 50%;
            animation: spin 1s linear infinite;

            margin: auto;
        }
        @keyframes spin{
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
            
        }

        /* result card */
        .result{
            margin-top: 15px;
            padding: 12px;

            background: #e8fff0;
            border-left: 5px solid #4fac4f;

            border-radius: 8px;

            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Mobile responsive */

        @media (max-width:600px){
            form{
                grid-template-columns: 1fr;
            }
            .full{
                grid-column: span 1;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h2>House Rent Prediction</h2>

    <form action="/predict_ui" method="post">

        <!-- FULL WIDTH -->
        <div class="full">
            <label>Area Locality</label>
            <input type="text" name="area_locality" required>
        </div>

        <!-- LEFT RIGHT GRID -->
        <div>
            <label>BHK</label>
            <input type="number" name="bhk" min="1" required>
        </div>

        <div>
            <label>Size</label>
            <input type="number" name="size" min="1" required>
        </div>

        <div>
            <label>Bathroom</label>
            <input type="number" name="bathroom" min="1" required>
        </div>

        <div>
            <label>Living Floor</label>
            <input type="number" name="living_floor" required>
        </div>

        <div>
            <label>Total Floor</label>
            <input type="number" name="total_floor" required>
        </div>

        <!-- DROPDOWNS FULL WIDTH -->
        <div class="full">
            <label>City</label>
            <select name="city">
                <option value="Chennai">Chennai</option>
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Hyderabad">Hyderabad</option>
            </select>
        </div>

        <div class="full">
            <label>Area Type</label>
            <select name="area_type">
                <option value="Super Area">Super Area</option>
                <option value="Carpet Area">Carpet Area</option>
                <option value="Built Area">Built Area</option>
            </select>
        </div>

        <div class="full">
            <label>Furnishing Status</label>
            <select name="furnishing_status">
                <option value="Unfurnished">Unfurnished</option>
                <option value="Semi-Furnished">Semi Furnished</option>
                <option value="Furnished">Furnished</option>
            </select>
        </div>

        <div class="full">
            <label>Tenant Preferred</label>
            <select name="tenant_preferred">
                <option value="Bachelors">Bachelors</option>
                <option value="Family">Family</option>
                <option value="Bachelors/Family">Bachelors/Family</option>
            </select>
        </div>

        <!-- BUTTON -->
        <div class="full">
            <button type="submit" onclick="showLoading()">
                <span id="btnText">Predict Rent</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </div>

    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>
<script>
    function showLoading(){
        document.getElementById("btnText").style.display = "none";
        document.getElementById("spinner").style.display = "block";
    }
</script>

</body>
</html>
